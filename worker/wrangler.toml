# 旅途小幫手 AI 代理——wrangler 設定（用命令列部署時才需要；用 Cloudflare 網頁後台貼程式碼則不用）
#   npx wrangler login
#   npx wrangler secret put GEMINI_KEY        # 貼上 Google AI Studio 的 key
#   npx wrangler deploy
name = "oki-helper-ai"
main = "ai-proxy.js"
compatibility_date = "2026-10-01"

[vars]
PROVIDER = "gemini"
GEMINI_MODELS = "gemini-3.8-flash,gemini-3.5-flash-lite"
ANTHROPIC_MODEL = "claude-haiku-5-5"
ALLOWED_ORIGINS = "https://kenhuangads.github.io"
DAILY_LIMIT = "400"

# 選用：要計每日次數上限才綁 KV（Storage & Databases → KV → 建命名空間，把 id 貼到下面）
# [[kv_namespaces]]
# binding = "COUNTER"
# id = "貼上命名空間 id"
